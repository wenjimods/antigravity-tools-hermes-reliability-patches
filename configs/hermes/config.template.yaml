# Hermes Configuration Template for AGT 8045 Local Bridge
# Place this in ~/.hermes/config.yaml or your active Hermes workspace

default_provider: "openai"
default_model: "gemini-2.5-pro"

providers:
  openai:
    base_url: "http://127.0.0.1:8045/v1"
    # Note: Sensitive API key should be injected via environment variable (e.g. AGT_PROXY_KEY / OPENAI_API_KEY)
    # api_key: "${AGT_PROXY_API_KEY}"

retry:
  max_retries: 5
  initial_backoff: 2.0
  max_backoff: 60.0

timeout:
  connect_timeout: 10.0
  read_timeout: 120.0
