name: verify
on:
  workflow_dispatch:
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: AMD64
          - os: macos-14
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install pytest
      - name: Assert runner architecture
        shell: bash
        run: python -c "import platform; a=platform.machine().lower(); assert a == '${{ matrix.arch }}'.lower(), (a, '${{ matrix.arch }}')"
      - name: Run verification
        run: python scripts/verify.py
